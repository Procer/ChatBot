<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | ZSG-Bot-iA</title>
    <link rel="icon" type="image/png" href="/static/Logo-ZSG-Bot-iA-Circulo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb' }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #000; color: #fff; height: 100vh; overflow: hidden; }
        .side-branding { 
            background: linear-gradient(135deg, #050505 0%, #000 100%); 
            border-right: 1px solid rgba(255,255,255,0.05); 
        }
        .input-minimal { 
            background: transparent; 
            border: 1px solid rgba(255,255,255,0.1); 
            transition: all 0.2s ease;
        }
        .input-minimal:focus { 
            border-color: #3b82f6; 
            background: rgba(255,255,255,0.02);
            outline: none;
        }
        .btn-primary { 
            background: #fff; 
            color: #000; 
            transition: all 0.2s ease;
        }
        .btn-primary:hover { background: #3b82f6; color: #fff; }
    </style>
</head>
<body class="font-sans flex flex-row">

    <!-- LADO IZQUIERDO: BRANDING (SOLO DESKTOP) -->
    <div class="side-branding hidden md:flex w-3/5 lg:w-2/3 flex-col items-center justify-center p-12 relative overflow-hidden shrink-0 h-full">
        <div class="relative z-10 text-center">
            <img src="/static/Logo-ZSG-Bot-iA-Negro.png" alt="Logo" class="w-64 lg:w-80 h-auto mx-auto mb-8 max-w-full px-4">
            <div class="space-y-2">
                <h2 class="text-4xl lg:text-6xl font-black tracking-tighter uppercase">ZSG-Bot<span class="text-brand-500">iA</span></h2>
                <p class="text-slate-500 text-xs lg:text-sm font-bold uppercase tracking-[0.6em]">Inteligencia Artificial Avanzada</p>
            </div>
        </div>
        <div class="absolute bottom-10 left-10 opacity-20">
            <p class="text-[10px] font-black uppercase tracking-widest">ESTADO: SISTEMA ACTIVO</p>
        </div>
    </div>

    <!-- LADO DERECHO: ACCESO (ADAPTATIVO) -->
    <div class="w-full md:w-2/5 lg:w-1/3 bg-black flex flex-col justify-center p-6 sm:p-12 lg:p-16 h-full overflow-hidden">
        <div class="max-w-md w-full mx-auto flex flex-col h-full md:h-auto justify-center md:justify-start">
            
            <!-- Logo solo en Mobile -->
            <div class="md:hidden text-center mb-6">
                <img src="/static/Logo-ZSG-Bot-iA-Negro.png" alt="Logo" class="w-24 h-auto mx-auto mb-3">
                <h2 class="text-xl font-black tracking-tighter uppercase">ZSG-Bot<span class="text-brand-500">iA</span></h2>
            </div>

            <header class="mb-6 md:mb-12 text-center md:text-left">
                <h1 class="text-xl md:text-2xl font-black tracking-tight text-white uppercase">Acceso al Panel</h1>
                <p class="text-slate-500 text-[9px] font-bold uppercase tracking-widest mt-1">Ingrese sus credenciales</p>
            </header>

            <form action="/acceso" method="post" class="space-y-4 md:space-y-8">
                {% if error %}
                <div class="py-2 px-4 bg-rose-500/10 border-l-2 border-rose-500 text-rose-500 text-[9px] font-black uppercase tracking-widest">
                    {{ error }}
                </div>
                {% endif %}

                <div class="space-y-4 md:space-y-6">
                    <div class="space-y-1 md:space-y-2">
                        <label class="text-[8px] md:text-[9px] font-black text-slate-500 uppercase tracking-widest">Identificador</label>
                        <input type="text" name="username" required autofocus placeholder="Usuario"
                            class="input-minimal w-full py-3 md:py-4 px-4 text-sm text-white placeholder:text-slate-800">
                    </div>

                    <div class="space-y-1 md:space-y-2">
                        <label class="text-[8px] md:text-[9px] font-black text-slate-500 uppercase tracking-widest">Clave de Seguridad</label>
                        <input type="password" name="password" required placeholder="••••••••"
                            class="input-minimal w-full py-3 md:py-4 px-4 text-sm text-white placeholder:text-slate-800">
                    </div>
                </div>

                <div class="pt-2 md:pt-4">
                    <button type="submit" class="btn-primary w-full py-4 md:py-5 font-black text-[10px] md:text-[11px] uppercase tracking-widest">
                        Ingresar
                    </button>
                </div>
            </form>

            <footer class="mt-8 md:mt-20 text-center md:text-left">
                <p class="text-[8px] font-black text-slate-800 uppercase tracking-[0.4em]">
                    &copy; 2026 Zárate System Group
                </p>
            </footer>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
